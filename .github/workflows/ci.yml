name: CI

# 运行镜像显式锁定，不使用 ubuntu-latest。
# GitHub 从 2026-10-19 起把 ubuntu-latest 滚动迁移到 Ubuntu 26.04（预计 11-19 完成），
# 迁移期间同一个 workflow 可能随机落在 24.04 或 26.04 上，构建结果不再可复现。
# 需要提前验证下一代镜像时，手动触发并选择 runner=ubuntu-26.04。
# 2026-11-08 已用 runner=ubuntu-26.04 跑通全部 job（后端测试与迁移、前端构建与测试均 success），
# 说明本项目的工具链不依赖镜像内的系统 Python/Node，后续迁移到 26.04 时把默认值改掉即可。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 运行镜像（提前验证下一代镜像用）
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-26.04

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试与迁移
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 运行测试
        working-directory: backend
        run: python -m pytest -q --no-header

      - name: 空库跑通全部迁移并校验无漂移
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          set -euo pipefail
          rm -f ci_migrations.db
          python -m alembic upgrade head
          heads=$(python -m alembic heads | grep -c '(head)')
          echo "head 数量: $heads"
          test "$heads" -eq 1
          python -m alembic check

  frontend:
    name: 前端构建与测试
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按 lock 文件）
        working-directory: frontend
        run: npm ci

      - name: 构建
        working-directory: frontend
        run: npm run build

      - name: 运行测试
        working-directory: frontend
        run: npm test

  ci-gate:
    name: CI 通过
    if: always()
    needs: [backend, frontend]
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
    steps:
      - name: 汇总上游结果
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::存在未通过的任务，CI 判定为失败"
            exit 1
          fi
