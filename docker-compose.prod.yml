name: 99ipxin

x-api-environment: &api-environment
  ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?必须配置独立 PostgreSQL DATABASE_URL}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?必须配置高熵 JWT_SECRET_KEY}
  SESSION_TOKEN_HASH_KEY: ${SESSION_TOKEN_HASH_KEY:?必须配置独立会话哈希密钥}
  FRONTEND_ORIGIN: https://1.ipip99.com
  RATE_LIMIT_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  TRUSTED_PROXY_CIDRS: ${OPS_EDGE_WEB_IP:-172.29.99.10}/32,${OPS_EDGE_GATEWAY_IP:-172.29.99.1}/32

services:
  postgres:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_DB: ops_platform
      POSTGRES_USER: ops_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须配置独立 PostgreSQL 密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_platform -d ops_platform"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    user: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: 99ipxin-api:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["maintenance"]
    read_only: true
    tmpfs:
      - /tmp

  api:
    image: 99ipxin-api:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *api-environment
      GLOBAL_PROXY_API_KEY: ${GLOBAL_PROXY_API_KEY:-}
    networks:
      data:
      edge:
        ipv4_address: ${OPS_EDGE_API_IP:-172.29.99.20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    image: 99ipxin-web:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      edge:
        ipv4_address: ${OPS_EDGE_WEB_IP:-172.29.99.10}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  data:
    internal: true
    ipam:
      config:
        - subnet: ${OPS_DATA_SUBNET:-172.29.100.0/24}
  edge:
    ipam:
      config:
        - subnet: ${OPS_EDGE_SUBNET:-172.29.99.0/24}
          gateway: ${OPS_EDGE_GATEWAY_IP:-172.29.99.1}
